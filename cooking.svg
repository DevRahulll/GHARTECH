<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" role="img" aria-label="Something big is cooking. Ghartech MVP build progress." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f24"/><stop offset="1" stop-color="#171244"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9fb4ff" stroke-width=".6"/></pattern>
  <pattern id="hazard" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="13" height="26" fill="#ffb800"/><rect x="13" width="13" height="26" fill="#1a1a2e"/>
    <animate attributeName="x" from="0" to="26" dur="1s" repeatCount="indefinite"/>
  </pattern>
</defs>
<style>
  text{font-family:Segoe UI, Helvetica, Arial, sans-serif}
  .steam{animation:steam 3s ease-in infinite;opacity:0}
  @keyframes steam{0%{transform:translateY(14px);opacity:0}30%{opacity:.65}100%{transform:translateY(-30px);opacity:0}}
  .bub{animation:bub 2.4s ease-in infinite;opacity:0}
  @keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-34px);opacity:0}}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .5s ease-in-out infinite alternate}
  @keyframes fl{from{transform:scaleY(.8) scaleX(1.05)}to{transform:scaleY(1.2) scaleX(.9)}}
  .bob{animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
  .pot{transform-box:fill-box;transform-origin:50% 100%;animation:pot 2.2s ease-in-out infinite}
  @keyframes pot{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.99)}}
  .in{animation:in 1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important} .steam,.bub{opacity:.4!important}}
</style>
<rect x=".5" y=".5" width="899" height="269" rx="22" fill="url(#bg)" stroke="#2b3170"/>
<rect x=".5" y=".5" width="899" height="269" rx="22" fill="url(#grid)" opacity=".05"/>

<g transform="translate(112 252)"><path class="flame" style="animation-delay:0s" d="M0 0 C-9 -10 -7 -24 0 -32 C7 -24 9 -10 0 0Z" fill="#ff9f1c"/><path class="flame" style="animation-delay:0.15s" d="M0 0 C-4 -6 -3 -13 0 -17 C3 -13 4 -6 0 0Z" fill="#ffe08a"/></g><g transform="translate(150 252)"><path class="flame" style="animation-delay:0.2s" d="M0 0 C-9 -10 -7 -24 0 -32 C7 -24 9 -10 0 0Z" fill="#ff9f1c"/><path class="flame" style="animation-delay:0.35s" d="M0 0 C-4 -6 -3 -13 0 -17 C3 -13 4 -6 0 0Z" fill="#ffe08a"/></g><g transform="translate(188 252)"><path class="flame" style="animation-delay:0.1s" d="M0 0 C-9 -10 -7 -24 0 -32 C7 -24 9 -10 0 0Z" fill="#ff9f1c"/><path class="flame" style="animation-delay:0.25s" d="M0 0 C-4 -6 -3 -13 0 -17 C3 -13 4 -6 0 0Z" fill="#ffe08a"/></g>
<path class="steam" style="animation-delay:0.0s" d="M118 128 q10 -14 0 -28 t0 -28" fill="none" stroke="#d5dbff" stroke-width="4" stroke-linecap="round"/><path class="steam" style="animation-delay:0.9s" d="M150 128 q10 -14 0 -28 t0 -28" fill="none" stroke="#d5dbff" stroke-width="4" stroke-linecap="round"/><path class="steam" style="animation-delay:1.8s" d="M182 128 q10 -14 0 -28 t0 -28" fill="none" stroke="#d5dbff" stroke-width="4" stroke-linecap="round"/>
<g class="bob">
  <polygon points="124,126 150,102 176,126" fill="#ff6b5e"/>
  <rect x="128" y="126" width="44" height="30" fill="#2c3260" stroke="#4a5392"/>
  <rect x="144" y="136" width="12" height="20" rx="1.5" fill="#ffb800"/>
  <rect x="133" y="132" width="8" height="8" rx="1" fill="#ffd166"/><rect x="159" y="132" width="8" height="8" rx="1" fill="#ffd166"/>
</g>
<g class="pot">
  <path d="M84 152 h132 v42 q0 36 -36 36 h-60 q-36 0 -36 -36 z" fill="#2b3163" stroke="#5864b8" stroke-width="1.5"/>
  <rect x="76" y="144" width="148" height="12" rx="6" fill="#3d4580" stroke="#5864b8"/>
  <rect x="62" y="170" width="22" height="9" rx="4.5" fill="#3d4580"/><rect x="216" y="170" width="22" height="9" rx="4.5" fill="#3d4580"/>
  <path d="M100 176 q0 30 20 40" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="5" stroke-linecap="round"/>
</g>
<circle class="bub" style="animation-delay:0.0s" cx="100" cy="150" r="4" fill="#cfd6ff"/><circle class="bub" style="animation-delay:0.6s" cx="198" cy="150" r="5" fill="#cfd6ff"/><circle class="bub" style="animation-delay:1.2s" cx="126" cy="150" r="3" fill="#cfd6ff"/><circle class="bub" style="animation-delay:1.7999999999999998s" cx="176" cy="150" r="3" fill="#cfd6ff"/>

<g class="in">
  <text x="310" y="68" font-size="16" font-weight="600" fill="#ffcf5c">Something big is cooking</text>
  <text x="310" y="116" font-size="42" font-weight="800" fill="#f4f6ff" letter-spacing=".5">Brick by brick,</text>
  <text x="310" y="160" font-size="42" font-weight="800" fill="#f4f6ff" letter-spacing=".5">byte by byte.</text>
</g>
<text x="310" y="192" font-size="15" fill="#a9b3ee" class="in" style="animation-delay:.3s">Reimagining how people buy and build homes. Coming to ghartech.co</text>

<text x="310" y="222" font-size="13" fill="#8f99dc">MVP build progress</text>
<rect x="310" y="230" width="470" height="16" rx="8" fill="#161b3f" stroke="#2f3878"/>
<rect x="311" y="231" height="14" rx="7" width="0" fill="url(#hazard)">
  <animate attributeName="width" from="0" to="164" dur="2.4s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
</rect>
<text x="796" y="243" font-size="14" font-weight="700" fill="#ffcf5c">35%</text>
</svg>